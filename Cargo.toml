[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/casey-bowman/kamiroh"

[workspace.dependencies]
kamiroh-domain = { path = "crates/kamiroh-domain", version = "0.1.0" }
kamiroh-ports = { path = "crates/kamiroh-ports", version = "0.1.0" }
kamiroh-app = { path = "crates/kamiroh-app", version = "0.1.0" }
kamiroh-adapter-iroh = { path = "crates/kamiroh-adapter-iroh", version = "0.1.0" }
kamiroh-adapter-kameo = { path = "crates/kamiroh-adapter-kameo", version = "0.1.0" }
kamiroh-adapter-memory = { path = "crates/kamiroh-adapter-memory", version = "0.1.0" }

[package]
name = "kamiroh"
version.workspace = true
edition.workspace = true
description = "Peer actors, addressable by name and endpoint, that message each other--locally or across the network—-to drive agents"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
kamiroh-domain.workspace = true
kamiroh-ports.workspace = true
kamiroh-app.workspace = true
kamiroh-adapter-iroh.workspace = true
kamiroh-adapter-kameo.workspace = true
kamiroh-adapter-memory.workspace = true

[dev-dependencies]
# Exact pin (dependency-bump hardening, 2026-08-20 incident): the
# executable-specification runner for features/. 0.23.0 was published
# 2026-04-23 and its MSRV (1.88) sits well under the sandbox floor.
cucumber = "=0.23.0"
# Exact pin, same hardening. Already in the lockfile via iroh and kameo, so
# this adds no crate to the tree — it is here because one scenario ("a
# conversation spans connections") is about real connections, and real
# sockets need a reactor.
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }

# The executable specification (roadmap 6). `harness = false`: cucumber
# brings its own runner. The ordinary `tests/*.rs` remain the fast gate.
[[test]]
name = "cucumber"
harness = false
